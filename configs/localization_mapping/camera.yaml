# Building navigation pinhole camera calibration (ROS parameter file).
# The 640x480 image is half-scaled (scale 0.5); fx/fy are equal, principal point
# is the image center, and d0..d3 are zero, i.e. no lens distortion is modelled.
/**:
  ros__parameters:
    cam_model: Pinhole
    cam_width: 640
    cam_height: 480
    scale: 0.5
    cam_fx: 381.3611496301472
    cam_fy: 381.3611496301472
    cam_cx: 320.0
    cam_cy: 240.0
    cam_d0: 0.0
    cam_d1: 0.0
    cam_d2: 0.0
    cam_d3: 0.0
