# FAST-LIVO2 pinhole camera used by the sample dataset: 1280x1024 sensor,
# images down-scaled by 0.5 before processing. cam_fx/cam_fy/cam_cx/cam_cy are in
# (scaled) pixels; cam_d0..cam_d3 are the radial-tangential distortion
# coefficients (OpenCV k1, k2, p1, p2) that PinholeCamera applies in unproject.
/**:
  ros__parameters:
    cam_model: Pinhole
    cam_width: 1280
    cam_height: 1024
    scale: 0.5
    cam_fx: 1293.56944
    cam_fy: 1293.3155
    cam_cx: 626.91359
    cam_cy: 522.799224
    cam_d0: -0.076160
    cam_d1: 0.123001
    cam_d2: -0.00113
    cam_d3: 0.000251